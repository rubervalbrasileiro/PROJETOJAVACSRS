<body>
  <center><h1>Cadastro de Usuário</h1></center>
  <hr>
  <form>
    <label for="name">Nome Completo:</label>
    <p><input type="text" id="nome" placeholder="Informe seu nome completo:" required></p>
    <label for="cpf">Didigite seu CPF:</label>
    <p><input type="text" id="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"></p>
    <label for="email">Didite seu e-mail:</label>
    <p><input type="text" id="email" placeholder="Didite seu e-mail:"></p>

    <button type="submit">Cadastrar</button>
    <button type="button" id="atualizar">Atualizar</button>
    <button type="button" id="excluir">Excluir</button>
  </form>
